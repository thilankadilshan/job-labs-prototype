# nginx config for the Job Labs static prototype (mirrors vercel.json)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # serve /about-us from /about-us/index.html without a trailing-slash redirect
    absolute_redirect off;
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # same redirects as vercel.json / the Laravel routes
    location = /home                 { return 302 /; }
    location = /jobs                 { return 302 /; }
    location = /career-hub           { return 302 /; }
    location = /ats                  { return 302 /login; }
    location = /terms-and-conditions { return 302 /terms-of-service; }

    # strip trailing slash (except root) so URLs look like the live site
    rewrite ^/(.+)/$ /$1 permanent;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # cache static assets
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|webp|otf|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
